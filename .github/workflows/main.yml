name: Build & Deploy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-tickers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tickers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: services/tickers/package-lock.json
      - run: npm ci
      - run: npm test

  check-market-wiz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-wiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: services/market-wiz/package-lock.json
      - run: npm ci
      - run: npm test

  build-bot-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tickers, marketwiz]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file services/dockerfile.${{ matrix.service }} services

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check-tickers, check-market-wiz, build-bot-images]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy discord-market-bots
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{secrets.SSH_HOST}} # IP address of the server you wish to ssh into
          key: ${{secrets.SSH_KEY}} # Private or public key of the server
          username: ${{secrets.SSH_USERNAME}} # User of the server you want to ssh into
          script: |
            set -euo pipefail
            cd code/Discord-Market-Bots/services
            git pull
            docker compose up --build -d
            docker image prune -af
            docker builder prune -af
            echo 'Deployment successful'
