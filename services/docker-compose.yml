name: discord-bot-tickers

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  tickers:
    image: tickers
    build:
      context: .
      dockerfile: dockerfile.tickers
    environment:
      - UPTIME_HEARTBEAT_URL=${UPTIME_HEARTBEAT_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    volumes:
      - ./tickers/logs:/app/logs
    restart: always
    logging: *default-logging
    networks:
      app-network:
        # The Cloudflare tunnel sends TradingView webhooks to 172.20.0.3:8000
        ipv4_address: 172.20.0.3

  market-wiz:
    image: market-wiz
    build:
      context: .
      dockerfile: dockerfile.marketwiz
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
    volumes:
      - ./market-wiz/logs:/app/logs
      - ./market-wiz/data:/app/data
    restart: always
    logging: *default-logging
    platform: linux/amd64
    networks:
      app-network:
        ipv4_address: 172.20.0.5

  cloudflare-tunnel:
    image: cloudflare/cloudflared:2026.10.6
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always
    logging: *default-logging
    profiles:
      - ${ENVIRONMENT:-prod} 
    networks:
      app-network:
        ipv4_address: 172.20.0.6

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

